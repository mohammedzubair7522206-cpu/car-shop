<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cfcfd6" />
      <stop offset="70%" stop-color="#737380" />
      <stop offset="100%" stop-color="#e2e2e8" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#b30000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Hexagonal Shield / Crest -->
  <polygon points="256,76 396,156 396,356 256,436 116,356 116,156" fill="rgba(20,20,25,0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="3" filter="url(#shadow)" />

  <!-- Red Racing Striping -->
  <path d="M 236,110 L 276,110 L 260,402 L 220,402 Z" fill="url(#redAccent)" opacity="0.9" />

  <!-- Monogram ED -->
  <text x="256" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Helvetica Neue', sans-serif" font-size="140" font-weight="900" letter-spacing="4" fill="url(#metalGrad)" text-anchor="middle" filter="url(#shadow)">ED</text>

  <!-- Speed Wing Accent -->
  <path d="M 170,335 L 342,335" stroke="url(#redAccent)" stroke-width="8" stroke-linecap="round" />
</svg>
